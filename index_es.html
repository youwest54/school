<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon2-180.png">

<meta name="mobile-web-app-capable" content="yes">

  <title>Español Pages</title>

  <style>
    :root{
      --pad:clamp(.75rem,3.5vw,1.1rem);
      --fs-body:clamp(1rem,4vw,1.15rem);
      --fs-h1:clamp(1.4rem,6vw,1.8rem);

      --primary:#1976d2; --background:#f4f4f9; --tile-bg:#fff;
      --tile-radius:12px; --tile-shadow:0 2px 8px rgba(0,0,0,.1);
      --done-filter:grayscale(100%) opacity(.6);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      background:var(--background);
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;
      padding:var(--pad);
      overflow-y:auto; -webkit-overflow-scrolling:touch;
      max-width:100%;
    }

    h1{
      font-size:var(--fs-h1);
      color:#333;text-align:center;
      margin-bottom:var(--pad);
    }

    .scroll-buffer{width:100%;height:14rem;flex-shrink:0}

    .grid{
      display:grid;width:100%;max-width:640px;gap:var(--pad);
      grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
      margin:1rem 0;
    }
    .grid a{
      position:relative;display:flex;align-items:center;justify-content:center;
      background:var(--tile-bg);border-radius:var(--tile-radius);
      box-shadow:var(--tile-shadow);
      text-decoration:none;color:var(--primary);
      font-size:var(--fs-body);padding:var(--pad);aspect-ratio:1/1;
      transition:background .2s,color .2s,transform .1s;
      user-select:none;touch-action:manipulation;
    }
    .grid a:nth-child(4n){margin-bottom:5rem}
    .grid a.done{filter:var(--done-filter)}

    .done-toggle{
      position:absolute;top:6px;right:6px;font-size:1.2rem;background:transparent;
      border:none;color:var(--primary);cursor:pointer;z-index:10;padding:0;line-height:1;
    }
    .grid a.done .done-toggle{opacity:.5}

    .grid a:hover{background:var(--primary);color:#fff}
    .grid a:active{transform:scale(.97)}
    .grid a.mine{font-size:.95rem;line-height:1.25;text-align:center;overflow:hidden;padding-top:1.8rem}
    .delete-page{
      position:absolute;top:6px;left:6px;z-index:11;
      font-size:.8rem;line-height:1.2;background:#fff;color:#c62828;
      border:1px solid #e57373;border-radius:8px;padding:.15rem .35rem;cursor:pointer;
    }
    .hint{max-width:640px;text-align:center;color:#555;line-height:1.4}

    #return-button{
      position:fixed;
      bottom:calc(env(safe-area-inset-bottom,0) + 1rem);
      left:  calc(env(safe-area-inset-left ,0) + 1rem);
      width:10rem;height:10rem;font-size:4rem;
      display:flex;align-items:center;justify-content:center;
      text-decoration:none;border:none;border-radius:50%;
      background:var(--primary);color:#fff;
      box-shadow:0 3px 8px rgba(0,0,0,.25);
      z-index:1002;cursor:pointer;touch-action:manipulation;
      transition:transform .25s ease,opacity .25s ease;
    }
    body.scrolled #return-button{transform:scale(.85);opacity:.4}

    @media(max-width:400px){
      #return-button{width:7rem;height:7rem;font-size:3rem}
      .grid a{font-size:.9rem;padding:calc(var(--pad)*.65)}
      h1{font-size:clamp(1.25rem,6vw,1.6rem)}
    }

    @media(prefers-color-scheme:dark){
      body{background:#111;color:#e4e4e4}
      .grid a,.delete-page{background:#1c1c1e}
      .hint{color:#bbb}
    }
  </style>
</head>
<body>
  <h1>Español Pages</h1>

  <div class="scroll-buffer"></div>

  <nav class="grid"></nav>
  <p class="hint" id="empty">No pages yet. Use Add new page on the first screen.</p>

  <div class="scroll-buffer"></div>

  <a id="return-button" href="index.html" title="Back">←</a>

  <script src="marks.js?v=6"></script>
  <script src="pages.js?v=8"></script>
  <script>
    function paintTiles(){
      document.querySelectorAll('.grid a').forEach(tile=>{
        tile.classList.toggle('done', window.Marks.isDone(tile.getAttribute('href')));
      });
    }
    function wireTile(tile){
      if(tile.dataset.wired) return;
      tile.dataset.wired='1';
      const href=tile.getAttribute('href');
      const btn=document.createElement('button');
      btn.type='button';
      btn.innerHTML='✔';btn.className='done-toggle';tile.append(btn);
      btn.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        window.Marks.setDone(href, !window.Marks.isDone(href));
      });
    }
    function showMine(){
      const grid=document.querySelector('.grid');
      const pages=window.Pages.list('es');
      grid.querySelectorAll('a.mine').forEach(a=>a.remove());
      pages.forEach(page=>{
        const a=document.createElement('a');
        a.className='mine';
        a.href='custom.html?id='+page.id;
        a.textContent=page.title;
        const del=document.createElement('button');
        del.type='button';
        del.className='delete-page';
        del.textContent='Delete';
        del.addEventListener('click',e=>{
          e.preventDefault();
          e.stopPropagation();
          window.Pages.askRemove(page.id).catch(()=>alert('Could not delete. Check the internet and try again.'));
        });
        a.appendChild(del);
        grid.appendChild(a);
        wireTile(a);
      });
      document.getElementById('empty').hidden=pages.length>0;
      paintTiles();
    }
    window.Pages.onChange(showMine);
    showMine();
    window.Pages.ready.then(showMine);
    window.Marks.onChange(paintTiles);
    paintTiles();
    window.Marks.ready.then(paintTiles);

    document.addEventListener('scroll',()=>document.body.classList.
      toggle('scrolled',window.scrollY>40));
  </script>
<link rel="stylesheet" href="app.css?v=1">
<script src="app.js?v=1"></script>
</body>
</html>
