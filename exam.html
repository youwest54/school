<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Learn">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon3-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Exam</title>
  <style>
    body{margin:0;padding:1rem;text-align:center}
    h1{margin:.15rem 0 .15rem;font-size:1.55rem}
    #score,.from{color:#6e6e73;margin:.3rem auto;max-width:520px}
    .from{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .exam-card{
      background:#fff;border-radius:22px;cursor:pointer;
      box-shadow:0 10px 28px rgba(28,28,30,.08);
      padding:1rem;margin:.85rem auto 0;max-width:520px;
      display:flex;flex-direction:column;gap:.75rem
    }
    .exam-top{display:flex;align-items:center;justify-content:space-between;height:36px}
    .exam-lang{
      margin:0;padding:.28rem .7rem;border-radius:999px;
      background:#e8f3ff;color:#0a84ff;font-size:.75rem;font-weight:750
    }
    .exam-words{
      height:56px;margin:0;display:flex;align-items:center;justify-content:safe center;
      overflow-x:auto;white-space:nowrap;font-size:1.4rem;font-weight:750;
      letter-spacing:-.02em;line-height:1.2;scrollbar-width:none
    }
    .exam-words::-webkit-scrollbar{display:none}
    .card-actions{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
    .card-actions button,.retry{
      height:50px;min-height:50px;width:100%;border:none;border-radius:14px;
      font-size:1rem;font-weight:750;padding:0 .6rem
    }
    #show{grid-column:1 / -1}
    #play{
      width:76px;height:36px;min-height:0;padding:0;border:none;border-radius:999px;
      background:#e8f3ff;color:#0a84ff;font-size:.85rem;font-weight:750;flex:none
    }
    #show,#knew{background:#0a84ff;color:#fff}
    #again,.retry{background:#eef2f8;color:#1c1c1e}
    .retry{display:block;width:100%;max-width:520px;margin:1rem auto 0}
    [hidden]{display:none !important}
    @media(prefers-color-scheme:dark){
      .exam-card{background:#1c1c1e}
      .exam-words{color:#f2f2f7}
      .exam-lang,#play{background:#1a3352;color:#64b5ff}
      #again,.retry{background:#2c2c2e;color:#f2f2f7}
    }
  </style>
</head>
<body>
  <h1 id="title">Exam</h1>
  <p id="score" class="hint">Loading words…</p>
  <p id="from" class="from" hidden></p>
  <div id="card" class="exam-card" hidden>
    <div class="exam-top">
      <p id="lang" class="exam-lang"></p>
      <button id="play" type="button">Speak</button>
    </div>
    <p id="words" class="exam-words"></p>
    <div class="card-actions">
      <button id="show" type="button">Show English</button>
      <button id="again" type="button">Again</button>
      <button id="knew" type="button">I knew it</button>
    </div>
  </div>
  <p id="empty" class="hint" hidden></p>
  <button id="retry" class="retry" type="button" hidden>Start again</button>
  <a id="return-button" href="index.html" title="Back">Back</a>
  <script src="pages.js?v=8"></script>
  <script src="voice.js?v=4"></script>
  <script src="exam.js?v=4"></script>
  <link rel="stylesheet" href="app.css?v=2">
  <script src="app.js?v=1"></script>
</body>
</html>
