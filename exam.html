<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Learn">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon3-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Exam</title>
  <style>
    body{margin:0;padding:1rem;text-align:center}
    h1{margin:.15rem 0 .15rem;font-size:1.55rem}
    .exam-score{
      display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:.4rem;
      max-width:520px;margin:.3rem auto
    }
    #score,.from{color:#6e6e73;margin:0}
    #score{text-align:left}
    #reset,#fav-page{
      height:34px;padding:0 .75rem;border:none;border-radius:999px;
      background:#eef2f8;color:#1c1c1e;font-weight:750;font-size:.85rem;
      text-decoration:none;display:inline-flex;align-items:center;justify-content:center
    }
    .from{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .exam-card{
      background:#fff;border-radius:22px;cursor:pointer;
      box-shadow:0 10px 28px rgba(28,28,30,.08);
      padding:1rem;margin:.85rem auto 0;max-width:520px;
      display:flex;flex-direction:column;gap:.75rem
    }
    .exam-top{display:flex;align-items:center;justify-content:space-between;gap:.4rem;height:36px}
    #fav{
      height:36px;min-width:104px;padding:0 .7rem;border:none;border-radius:999px;
      background:#eef2f8;color:#1c1c1e;font-size:.85rem;font-weight:750
    }
    #fav.on{background:#ffd000;color:#1c1c1e}
    .exam-lang{
      margin:0;padding:.28rem .7rem;border-radius:999px;
      background:#e8f3ff;color:#0a84ff;font-size:.75rem;font-weight:750
    }
    .exam-words{
      margin:0;min-height:56px;display:grid;place-items:center;text-align:center;
      white-space:normal;overflow:visible;font-size:1.35rem;font-weight:750;
      letter-spacing:-.02em;line-height:1.35;padding:.2rem 0
    }
    .exam-dock{
      position:fixed;z-index:1004;left:50%;transform:translateX(-50%);
      width:min(520px,calc(100% - 24px));
      bottom:calc(env(safe-area-inset-bottom) + 4.6rem);
      display:grid;grid-template-columns:1fr 1fr;gap:.5rem
    }
    .exam-dock button,.retry{
      height:50px;min-height:50px;width:100%;border:none;border-radius:14px;
      font-size:1rem;font-weight:750;padding:0 .6rem
    }
    #show{grid-column:1 / -1}
    #play{
      width:76px;height:36px;min-height:0;padding:0;border:none;border-radius:999px;
      background:#e8f3ff;color:#0a84ff;font-size:.85rem;font-weight:750;flex:none
    }
    #show,#knew{background:#0a84ff;color:#fff}
    #again,.retry{background:#eef2f8;color:#1c1c1e}
    .retry{display:block;width:100%;max-width:520px;margin:1rem auto 0}
    [hidden]{display:none !important}
    @media(prefers-color-scheme:dark){
      .exam-card{background:#1c1c1e}
      .exam-words{color:#f2f2f7}
      .exam-lang,#play{background:#1a3352;color:#64b5ff}
      #reset,#fav-page,#fav{background:#2c2c2e;color:#f2f2f7}
      #fav.on{background:#ffd000;color:#1c1c1e}
      #again,.retry{background:#2c2c2e;color:#f2f2f7}
    }
  </style>
</head>
<body>
  <h1 id="title">Exam</h1>
  <div class="exam-score">
    <p id="score" class="hint">Loading words…</p>
    <button id="reset" type="button" hidden>Reset</button>
    <a id="fav-page" href="fav.html?v=1">Favorites</a>
  </div>
  <p id="from" class="from" hidden></p>
  <div id="card" class="exam-card" hidden>
    <div class="exam-top">
      <p id="lang" class="exam-lang"></p>
      <button id="fav" type="button" hidden>Favorite</button>
      <button id="play" type="button">Speak</button>
    </div>
    <p id="words" class="exam-words"></p>
  </div>
  <div id="dock" class="exam-dock" hidden>
    <button id="show" type="button">Show English</button>
    <button id="again" type="button">Again</button>
    <button id="knew" type="button">I knew it</button>
  </div>
  <p id="empty" class="hint" hidden></p>
  <button id="retry" class="retry" type="button" hidden>Start again</button>
  <a id="return-button" href="index.html" title="Back">Back</a>
  <script src="pages.js?v=9"></script>
  <script src="voice.js?v=5"></script>
  <script src="exam.js?v=8"></script>
  <link rel="stylesheet" href="app.css?v=3">
  <style>
    body:has(#return-button){padding-bottom:calc(14.5rem + env(safe-area-inset-bottom)) !important}
  </style>
  <script src="app.js?v=1"></script>
</body>
</html>
