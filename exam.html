<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Learn">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon3-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Exam</title>
  <style>
    body{margin:0;padding:1rem;text-align:center}
    h1{margin:.2rem 0 .3rem}
    #score,.from{color:#6e6e73;margin:.35rem 0}
    .exam-card{
      background:#fff;border-radius:16px;cursor:pointer;
      box-shadow:0 10px 28px rgba(28,28,30,.08);
      padding:.55rem .6rem;margin:.8rem auto;max-width:520px;
      display:flex;flex-direction:row;align-items:center;gap:.45rem;text-align:left
    }
    .exam-line{display:flex;align-items:center;gap:.4rem;flex:1;min-width:0}
    .exam-lang{margin:0;flex:none;font-size:.75rem;color:#6e6e73;font-weight:700}
    .exam-words{
      margin:0;min-width:0;flex:1;white-space:nowrap;overflow-x:auto;
      font-size:1.05rem;font-weight:700;line-height:1.2;text-align:left
    }
    .card-actions{display:flex;flex-wrap:nowrap;gap:.35rem;flex:none;align-items:center}
    .card-actions button,.retry{
      flex:none;min-height:40px;border:none;border-radius:12px;
      font-size:.9rem;font-weight:800;padding:0 .7rem;white-space:nowrap
    }
    #play{width:2.5rem;height:2.5rem;min-height:0;padding:0;border-radius:50%;
      background:#fff;color:#0a84ff;box-shadow:0 2px 6px rgba(0,0,0,.16);font-size:1.05rem}
    #show,#knew{background:#0a84ff;color:#fff}
    #again,.retry{background:#eef2f8;color:#1c1c1e}
    .retry{width:100%;max-width:520px;margin-top:.6rem}
    @media(prefers-color-scheme:dark){
      .exam-card{background:#1c1c1e}
      .exam-words{color:#f2f2f7}
      #again,.retry{background:#2c2c2e;color:#f2f2f7}
    }
  </style>
</head>
<body>
  <h1 id="title">Exam</h1>
  <p id="score" class="hint">Loading words…</p>
  <p id="from" class="from" hidden></p>
  <div id="card" class="exam-card" hidden>
    <div class="exam-line">
      <p id="lang" class="exam-lang"></p>
      <p id="words" class="exam-words"></p>
    </div>
    <div class="card-actions">
      <button id="play" type="button">Speak</button>
      <button id="show" type="button">Show English</button>
      <button id="again" type="button" hidden>Again</button>
      <button id="knew" type="button" hidden>I knew it</button>
    </div>
  </div>
  <p id="empty" class="hint" hidden></p>
  <button id="retry" class="retry" type="button" hidden>Start again</button>
  <a id="return-button" href="index.html" title="Back">Back</a>
  <script src="pages.js?v=8"></script>
  <script src="voice.js?v=4"></script>
  <script src="exam.js?v=3"></script>
  <link rel="stylesheet" href="app.css?v=2">
  <script src="app.js?v=1"></script>
</body>
</html>
