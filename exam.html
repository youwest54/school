<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Learn">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon3-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Exam</title>
  <style>
    body{margin:0;padding:1rem 1rem calc(13rem + env(safe-area-inset-bottom))!important;text-align:center}
    h1{margin:.2rem 0 .3rem}
    #score,.from{color:#6e6e73;margin:.35rem 0}
    .exam-card{
      text-align:left;background:#fff;border-radius:22px;
      box-shadow:0 10px 28px rgba(28,28,30,.08);
      padding:1rem 1rem .4rem;margin:1rem auto;max-width:520px;min-height:180px
    }
    .exam-line{padding:.7rem 0 1rem;border-bottom:1px solid rgba(60,60,67,.12)}
    .exam-line:last-child{border-bottom:none}
    .exam-lang{margin:0 0 .25rem;font-size:.85rem;color:#6e6e73;font-weight:700}
    .exam-words{margin:0;font-size:1.35rem;font-weight:700;line-height:1.35}
    .exam-play{
      margin-top:.55rem;background:#0a84ff;color:#fff;border:none;border-radius:12px;
      min-height:40px;padding:0 .9rem;font-weight:700
    }
    .exam-actions{
      display:grid;gap:.6rem;max-width:520px;margin:0 auto;
      position:fixed;left:12px;right:12px;z-index:1004;
      bottom:calc(4.5rem + env(safe-area-inset-bottom))
    }
    .exam-actions button,.retry{
      min-height:52px;border:none;border-radius:16px;font-size:1.05rem;font-weight:800
    }
    #show,#knew{background:#0a84ff;color:#fff}
    #again,.retry{background:#eef2f8;color:#1c1c1e}
    .retry{width:100%;max-width:520px;margin-top:.6rem}
    @media(prefers-color-scheme:dark){
      .exam-card{background:#1c1c1e}
      .exam-words{color:#f2f2f7}
      #again,.retry{background:#2c2c2e;color:#f2f2f7}
    }
  </style>
</head>
<body>
  <h1 id="title">Exam</h1>
  <p id="score" class="hint">Loading words…</p>
  <p id="from" class="from" hidden></p>
  <div id="card" class="exam-card" hidden></div>
  <div class="exam-actions">
    <button id="show" type="button" hidden>Show answer</button>
    <button id="again" type="button" hidden>Again</button>
    <button id="knew" type="button" hidden>I knew it</button>
  </div>
  <p id="empty" class="hint" hidden></p>
  <button id="retry" class="retry" type="button" hidden>Start again</button>
  <a id="return-button" href="index.html" title="Back">Back</a>
  <script src="pages.js?v=8"></script>
  <script src="voice.js?v=4"></script>
  <script src="exam.js?v=1"></script>
  <link rel="stylesheet" href="app.css?v=2">
  <script src="app.js?v=1"></script>
</body>
</html>
